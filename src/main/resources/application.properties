# MySQL connection settings. Values are read from environment variables.

jdbc.driver=${MYSQL_DRIVER:com.mysql.cj.jdbc.Driver}
jdbc.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:buttie}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
jdbc.username=${MYSQL_USER:root}
jdbc.password=${MYSQL_PASSWORD:}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION}

redis.port=${REDIS_PORT}
redis.host=${REDIS_HOST}

crypto.secret=${CRYPTO_SECRET}
crypto.algorithm=${CRYPTO_ALGORITHM:AES}

cookie.secure=${COOKIE_SECURE:true}

mydata.mock.base-url=${MYDATA_MOCK_BASE_URL:http://localhost:3000}
mydata.mock.org-code=${MYDATA_MOCK_ORG_CODE:MOCK001}
mydata.mock.client-id=${MYDATA_MOCK_CLIENT_ID:buttie}
mydata.mock.client-secret=${MYDATA_MOCK_CLIENT_SECRET:mock-secret}
mydata.mock.redirect-uri=${MYDATA_MOCK_REDIRECT_URI:http://localhost:8080/api/mydata/callback}
mydata.mock.app-scheme=${MYDATA_MOCK_APP_SCHEME:buttie}
portone.api.key=${PORTONE_API_KEY}

# 온통청년 API
youth.api.key=${YOUTH_CENTER_KEY}
# VWorld 행정구역코드 API
vworld.api.key=${VWORLD_API_KEY}
# VWorld 인증키 발급 시 등록한 도메인 (서비스유형 '웹사이트'는 domain 파라미터 필수)
vworld.domain=${VWORLD_DOMAIN:buttie.duckdns.org}
# 서울 열린 데이터 광장
seoul.api.key=${SEOUL_DATA_KEY}
# 경기 데이터 드림
gyeonggi.api.key=${GYEONGGI_DATA_KEY}
# 고용24 API
work24.api.key=${WORK_24_KEY}
