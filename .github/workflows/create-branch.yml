name: Create Feature Branch

on:
  workflow_call:
    inputs:
      jiraKey:
        required: true
        type: string
      branchName:
        required: true
        type: string

jobs:
  create-branch:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Create branch
        env:
          JIRA_KEY: ${{ inputs.jiraKey }}
          BRANCH_NAME: ${{ inputs.branchName }}
        run: |
          BRANCH="feature/${JIRA_KEY}-${BRANCH_NAME}"

          git checkout -b "$BRANCH"
          git push origin "$BRANCH"

          echo "Created branch: $BRANCH"