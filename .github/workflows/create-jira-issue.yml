name: Create Jira Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  create-jira:
    runs-on: ubuntu-latest

    outputs:
      jiraKey: ${{ steps.create.outputs.issue }}
      branchName: ${{ steps.parser.outputs.issueparser_branchName }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Parse issue form
        id: parser
        uses: stefanbuck/github-issue-parser@v3

      - name: Set Jira issue type
        id: issue-type
        env:
          GITHUB_ISSUE_TYPE: ${{ github.event.issue.type.name }}
        run: |
          case "${GITHUB_ISSUE_TYPE,,}" in
            bug)
              echo "jiraType=Bug" >> "$GITHUB_OUTPUT"
              ;;
            feature)
              echo "jiraType=Feature" >> "$GITHUB_OUTPUT"
              ;;
            test)
              echo "jiraType=Test" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "지원하지 않는 Issue Type입니다: $GITHUB_ISSUE_TYPE"
              exit 1
              ;;
          esac

      - name: Login Jira
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Create Jira issue
        id: create
        uses: atlassian/gajira-create@v3
        with:
          project: BUT
          issuetype: ${{ steps.issue-type.outputs.jiraType }}
          summary: ${{ github.event.issue.title }}
          description: |
            GitHub Issue:
            ${{ github.event.issue.html_url }}

            ${{ github.event.issue.body }}
          fields: |
            {
              "parent": {
                "key": "${{ steps.parser.outputs.issueparser_parentKey }}"
              }
            }

      - name: Update GitHub issue title
        env:
          GH_TOKEN: ${{ github.token }}
          JIRA_KEY: ${{ steps.create.outputs.issue }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --title "$JIRA_KEY $ISSUE_TITLE"

  create-branch:
    needs: create-jira
    uses: ./.github/workflows/create-branch.yml
    with:
      jiraKey: ${{ needs.create-jira.outputs.jiraKey }}
      branchName: ${{ needs.create-jira.outputs.branchName }}
