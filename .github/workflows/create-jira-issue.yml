name: Create Jira Issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  create-jira:
    runs-on: ubuntu-latest

    outputs:
      jiraKey: ${{ steps.create.outputs.jiraKey }}
      branchName: ${{ steps.parser.outputs.issueparser_branchName }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Parse issue form
        id: parser
        uses: stefanbuck/github-issue-parser@v3
        with:
          template-path: .github/ISSUE_TEMPLATE/feature-issue-template.yml

      - name: Set Jira issue type
        id: issue_type
        env:
          GITHUB_ISSUE_TYPE: ${{ github.event.issue.type.name }}
        run: |
          case "${GITHUB_ISSUE_TYPE,,}" in
            feature) echo "jiraType=Feature" >> "$GITHUB_OUTPUT" ;;
            bug) echo "jiraType=Bug" >> "$GITHUB_OUTPUT" ;;
            task) echo "jiraType=Task" >> "$GITHUB_OUTPUT" ;;
            test) echo "jiraType=Test" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "지원하지 않는 GitHub 이슈 타입입니다: $GITHUB_ISSUE_TYPE"
              exit 1
              ;;
          esac

      - name: Resolve Jira assignee
        id: assignee
        env:
          GITHUB_ASSIGNEE: ${{ github.event.issue.assignees[0].login }}
        run: |
          JIRA_ACCOUNT_ID=""

          case "$GITHUB_ASSIGNEE" in
            IWNFSky)
              JIRA_ACCOUNT_ID="712020:bd978ec6-6d8f-48e7-a072-a969aae3c091"
              ;;
            sudpdj124)
              JIRA_ACCOUNT_ID="712020:b3b40598-ed19-4274-9513-cee4a7969571"
              ;;
            ahhyunii)
              JIRA_ACCOUNT_ID="712020:6533c9c5-99f0-40a9-ac2f-badae9da4f58"
              ;;
            hurrayPersimmon)
              JIRA_ACCOUNT_ID="712020:bcf14a89-664f-4921-8d7b-4d4895443c5e"
              ;;
            M00NJK)
              JIRA_ACCOUNT_ID="712020:380017fb-c8d8-4881-9cbc-bb2fff999c76"
              ;;
            nanemo4168-arch)
              JIRA_ACCOUNT_ID="712020:a5eed99e-2cbf-41f7-8b35-0a95f42b8f8b"
              ;;
            "")
              echo "GitHub 담당자가 지정되지 않았습니다."
              ;;
            *)
              echo "Jira 계정 매핑이 없는 GitHub 담당자입니다: $GITHUB_ASSIGNEE"
              ;;
          esac

          echo "GitHub assignee: ${GITHUB_ASSIGNEE:-미지정}"

          if [ -n "$JIRA_ACCOUNT_ID" ]; then
            echo "Jira 담당자 매핑 완료"
          else
            echo "Jira 이슈를 담당자 없이 생성합니다."
          fi

          echo "jiraAccountId=$JIRA_ACCOUNT_ID" >> "$GITHUB_OUTPUT"

      - name: Check parsed values
        env:
          PARENT_KEY: ${{ steps.parser.outputs.issueparser_parentKey }}
          BRANCH_NAME: ${{ steps.parser.outputs.issueparser_branchName }}
        run: |
          echo "Parent key: $PARENT_KEY"
          echo "Branch name: $BRANCH_NAME"

          if [ -z "$PARENT_KEY" ]; then
            echo "parentKey 파싱에 실패했습니다."
            exit 1
          fi

      - name: Create Jira issue
        id: create
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_TYPE: ${{ steps.issue_type.outputs.jiraType }}
          JIRA_ACCOUNT_ID: ${{ steps.assignee.outputs.jiraAccountId }}
          PARENT_KEY: ${{ steps.parser.outputs.issueparser_parentKey }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          DESCRIPTION=$(printf '%s\n\n%s\n\n%s' \
            "GitHub Issue: $ISSUE_URL" \
            "$ISSUE_BODY" \
            "Created from GitHub")

          PAYLOAD=$(jq -n \
            --arg project "BUT" \
            --arg issueType "$JIRA_TYPE" \
            --arg summary "$ISSUE_TITLE" \
            --arg description "$DESCRIPTION" \
            --arg parentKey "$PARENT_KEY" \
            --arg assigneeId "$JIRA_ACCOUNT_ID" \
            '{
              fields: {
                project: {
                  key: $project
                },
                issuetype: {
                  name: $issueType
                },
                summary: $summary,
                description: {
                  type: "doc",
                  version: 1,
                  content: [
                    {
                      type: "paragraph",
                      content: [
                        {
                          type: "text",
                          text: $description
                        }
                      ]
                    }
                  ]
                },
                parent: {
                  key: $parentKey
                }
              }
            }
            | if $assigneeId != "" then
                .fields.assignee = {
                  id: $assigneeId
                }
              else
                .
              end')

          echo "Jira request payload:"
          echo "$PAYLOAD" | jq .

          HTTP_STATUS=$(curl -sS \
            -o response.json \
            -w "%{http_code}" \
            --request POST \
            --url "$JIRA_BASE_URL/rest/api/3/issue" \
            --user "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD")

          cat response.json

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Jira 이슈 생성 실패: HTTP $HTTP_STATUS"
            exit 1
          fi

          JIRA_KEY=$(jq -r '.key' response.json)

          if [ -z "$JIRA_KEY" ] || [ "$JIRA_KEY" = "null" ]; then
            echo "Jira Key를 응답에서 찾지 못했습니다."
            exit 1
          fi

          echo "jiraKey=$JIRA_KEY" >> "$GITHUB_OUTPUT"

      - name: Update GitHub issue title
        env:
          GH_TOKEN: ${{ github.token }}
          JIRA_KEY: ${{ steps.create.outputs.jiraKey }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --title "$JIRA_KEY $ISSUE_TITLE"

  create-branch:
    needs: create-jira
    uses: ./.github/workflows/create-branch.yml
    with:
      jiraKey: ${{ needs.create-jira.outputs.jiraKey }}
      branchName: ${{ needs.create-jira.outputs.branchName }}
