name: Close Jira Issue

on:
  issues:
    types: [closed]

jobs:
  close-jira:
    runs-on: ubuntu-latest

    steps:
      - name: Extract Jira key
        id: jira
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          JIRA_KEY=$(echo "$ISSUE_TITLE" | grep -oE '^BUT-[0-9]+' || true)

          if [ -z "$JIRA_KEY" ]; then
            echo "Jira Key가 제목에 없습니다."
            exit 0
          fi

          echo "jiraKey=$JIRA_KEY" >> "$GITHUB_OUTPUT"

      - name: Transition Jira issue
        if: steps.jira.outputs.jiraKey != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_KEY: ${{ steps.jira.outputs.jiraKey }}
        run: |
          curl -sS \
            --user "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            --header "Accept: application/json" \
            "$JIRA_BASE_URL/rest/api/3/issue/$JIRA_KEY/transitions" \
            > transitions.json

          cat transitions.json

          TRANSITION_ID=$(jq -r '
            .transitions[]
            | select(
                (.name | ascii_downcase) == "done"
                or (.name | ascii_downcase) == "complete"
                or (.to.name | ascii_downcase) == "done"
                or (.to.name | ascii_downcase) == "complete"
              )
            | .id
          ' transitions.json | head -n 1)

          if [ -z "$TRANSITION_ID" ] || [ "$TRANSITION_ID" = "null" ]; then
            echo "Done 또는 Complete 전환을 찾지 못했습니다."
            echo "현재 가능한 전환:"
            jq -r '.transitions[] | "\(.id): \(.name) -> \(.to.name)"' transitions.json
            exit 1
          fi

          HTTP_STATUS=$(curl -sS \
            -o response.json \
            -w "%{http_code}" \
            --request POST \
            --url "$JIRA_BASE_URL/rest/api/3/issue/$JIRA_KEY/transitions" \
            --user "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "$(jq -n --arg id "$TRANSITION_ID" \
              '{transition: {id: $id}}')")

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            cat response.json
            echo "Jira 상태 전환 실패: HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "$JIRA_KEY 상태 전환 완료"
