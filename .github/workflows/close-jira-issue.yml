name: Close Jira Issue

on:
  issues:
    types: [closed]

jobs:
  close-jira:
    runs-on: ubuntu-latest

    steps:
      - name: Extract Jira key
        id: key
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          JIRA_KEY=$(echo "$ISSUE_TITLE" | grep -oE '^BUT-[0-9]+')

          if [ -z "$JIRA_KEY" ]; then
            echo "Jira key not found"
            exit 0
          fi

          echo "jiraKey=$JIRA_KEY" >> "$GITHUB_OUTPUT"

      - name: Login Jira
        if: steps.key.outputs.jiraKey != ''
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Complete Jira issue
        if: steps.key.outputs.jiraKey != ''
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.key.outputs.jiraKey }}
          transition: task-done