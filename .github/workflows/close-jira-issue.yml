name: Close Jira Issue

on:
  issues:
    types:
      - closed

jobs:
  close-jira:
    runs-on: ubuntu-latest

    steps:
      - name: Extract Jira key
        id: jira
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail

          JIRA_KEY=$(printf '%s' "$ISSUE_TITLE" \
            | grep -oE 'BUT-[0-9]+' \
            | head -n 1 || true)

          if [ -z "$JIRA_KEY" ]; then
            echo "GitHub Issue 제목에서 Jira Key를 찾지 못했습니다."
            exit 0
          fi

          echo "jiraKey=$JIRA_KEY" >> "$GITHUB_OUTPUT"
          echo "Jira Key: $JIRA_KEY"

      - name: Find COMPLETE transition
        id: transition
        if: steps.jira.outputs.jiraKey != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_KEY: ${{ steps.jira.outputs.jiraKey }}
        run: |
          set -euo pipefail

          HTTP_STATUS=$(curl --silent --show-error \
            --output transitions.json \
            --write-out "%{http_code}" \
            --request GET \
            --url "${JIRA_BASE_URL}/rest/api/3/issue/${JIRA_KEY}/transitions" \
            --user "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
            --header "Accept: application/json")

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            cat transitions.json
            echo "Jira 전환 목록 조회 실패: HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "현재 가능한 전환:"
          jq -r '.transitions[] | "\(.id): \(.name) -> \(.to.name)"' transitions.json

          TRANSITION_ID=$(jq -r '
            .transitions[]
            | select(
                (.name | ascii_downcase) == "complete"
                or (.to.name | ascii_downcase) == "complete"
              )
            | .id
          ' transitions.json | head -n 1)

          if [ -z "$TRANSITION_ID" ] || [ "$TRANSITION_ID" = "null" ]; then
            echo "COMPLETE 전환을 찾지 못했습니다."
            exit 1
          fi

          echo "transitionId=$TRANSITION_ID" >> "$GITHUB_OUTPUT"
          echo "COMPLETE transition ID: $TRANSITION_ID"

      - name: Complete Jira issue
        if: steps.transition.outputs.transitionId != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_KEY: ${{ steps.jira.outputs.jiraKey }}
          TRANSITION_ID: ${{ steps.transition.outputs.transitionId }}
        run: |
          set -euo pipefail

          PAYLOAD=$(jq -n \
            --arg transitionId "$TRANSITION_ID" \
            '{
              transition: {
                id: $transitionId
              }
            }')

          HTTP_STATUS=$(curl --silent --show-error \
            --output response.json \
            --write-out "%{http_code}" \
            --request POST \
            --url "${JIRA_BASE_URL}/rest/api/3/issue/${JIRA_KEY}/transitions" \
            --user "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD")

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            cat response.json
            echo "Jira 상태 전환 실패: HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "${JIRA_KEY} → COMPLETE 상태 전환 완료"
